apply plugin: 'java'
apply plugin: 'application'

version = '4.0.0-dev'
mainClassName = 'meew0.mewtwo.MewtwoMain'

repositories {
    mavenCentral()
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots"
    }
}

dependencies {
    implementation "org.apache.commons:commons-lang3:3.14.0"
    implementation "commons-configuration:commons-configuration:1.10"
    implementation "commons-io:commons-io:2.16.1"
    implementation "com.google.guava:guava:33.2.1-jre"
    implementation "org.jruby:jruby-complete:9.4.8.0"
    implementation "org.xerial:sqlite-jdbc:3.46.0.0"
}

tasks.register('fatJar', Jar) {
    manifest {
        attributes 'Implementation-Title': 'Mewtwo',
                'Implementation-Version': version,
                'Main-Class': mainClassName
    }
    archiveBaseName = project.name + '-all-dev.jar'
    from { configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

tasks.register('copyToLib', Copy) {
    dependsOn build
    into "lib"
    from configurations.compileClasspath
}

tasks.register('buildGems') {
    dependsOn copyToLib
    def mewtwoGemFile = new File('MewtwoGemfile')
    //noinspection GroovyMissingReturnStatement
    mewtwoGemFile.eachLine {
        if (!(it.startsWith('#') || it.isEmpty())) {
            downloadOneGem(it)
        }
    }
}

def downloadOneGem(String target) {
    println "Downloading gem " + target
    def javaHome = System.getProperty('java.home')
    def javaExec = "${javaHome}/bin/java"
    exec {
        executable javaExec
        args "-jar", ("lib/jruby-complete-9.4.8.0.jar"), "-S", "gem", "install", "--conservative", "-i", "lib/", target
    }
}
