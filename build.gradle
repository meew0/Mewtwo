apply plugin: 'java'
apply plugin: 'application'

version = '4.0.0-dev'
mainClassName = 'meew0.mewtwo.MewtwoMain'

repositories {
    mavenCentral()
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots"
    }
}

dependencies {
    implementation "commons-configuration:commons-configuration:1.10"
    implementation "org.apache.commons:commons-io:1.3.2"
    implementation "com.google.guava:guava:18.0"
    implementation "org.jruby:jruby-complete:9.4.8.0"
    implementation "org.slf4j:slf4j-simple:1.7.7"
    implementation "junit:junit:3.8.1"
    implementation "org.projectlombok:lombok:1.14.8"
}

//noinspection GroovyAssignabilityCheck
task fatJar(type: Jar) {
    manifest {
        attributes 'Implementation-Title': 'Mewtwo',
                'Implementation-Version': version,
                'Main-Class': mainClassName
    }
    archiveBaseName = project.name + '-all-dev.jar'
    from { configurations.compileClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    //noinspection GroovyAssignabilityCheck
    with jar
}

task copyToLib(dependsOn: build, type: Copy) {
    into "lib"
    from configurations.compileClasspath
}

//noinspection GroovyAssignabilityCheck
task buildGems(dependsOn: copyToLib) {
    def mewtwoGemFile = new File('MewtwoGemfile')
    //noinspection GroovyMissingReturnStatement
    mewtwoGemFile.eachLine {
        if (!(it.startsWith('#') || it.isEmpty())) {
            downloadOneGem(it)
        }
    }
}

def downloadFile(String url, String path) {
    def f = new File(path)
    if (!f.exists()) {
        new URL(url).withInputStream { i -> f.withOutputStream { it.write(i) } }
    }
}

def downloadOneGem(String target) {
    println "Downloading gem " + target
    def javaHome = System.getProperty('java.home')
    def javaExec = "${javaHome}/bin/java"
    exec {
        executable javaExec
        args "-jar", ("lib/jruby-complete-9.4.8.0.jar"), "-S", "gem", "install", "-i", "lib/", target
    }
}
